<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body>
<svg id="s" width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const OL = 'stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
const ease = x => x<0?0:x>1?1:x*x*(3-2*x);

function cloud(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})" fill="#fff" ${OL}>
 <path d="M0 40 Q-10 0 30 5 Q45 -25 80 0 Q120 -15 125 25 Q150 35 130 55 L5 55 Q-15 55 0 40Z"/></g>`}

function house(){return `
 <rect x="0" y="330" width="720" height="460" fill="#7fd3c4" ${OL}/>
 <polygon points="-20,340 360,170 740,340" fill="#2f5d6b" ${OL}/>
 <rect x="470" y="190" width="45" height="90" fill="#b5543a" ${OL}/>
 ${[80,520].map(x=>`<rect x="${x}" y="420" width="130" height="110" rx="6" fill="#ffd56b" ${OL}/>
   <line x1="${x+65}" y1="420" x2="${x+65}" y2="530" ${OL}/><line x1="${x}" y1="475" x2="${x+130}" y2="475" ${OL}/>`).join('')}
 <path d="M300 790 L300 560 Q360 500 420 560 L420 790Z" fill="#9b59c6" ${OL}/>
 <circle cx="400" cy="680" r="7" fill="#ffd56b" ${OL}/>
 <rect x="-10" y="760" width="740" height="60" fill="#6cc04a" ${OL}/>
 ${[40,160,600,690].map(x=>`<circle cx="${x}" cy="770" r="45" fill="#3f9a3a" ${OL}/>`).join('')}
 <rect x="-10" y="815" width="740" height="40" fill="#cfcfcf" ${OL}/>
 <rect x="-10" y="855" width="740" height="440" fill="#8a8a92" ${OL}/>`}

function wheel(cx,cy,r,rot){
  let spokes='';for(let i=0;i<5;i++){const a=rot+i*Math.PI*2/5;
    spokes+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r*0.6}" y2="${cy+Math.sin(a)*r*0.6}" stroke="#7b3fd1" stroke-width="10" stroke-linecap="round"/>`}
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#222" ${OL}/>
   <circle cx="${cx}" cy="${cy}" r="${r*0.68}" fill="#444" ${OL}/>${spokes}
   <circle cx="${cx}" cy="${cy}" r="${r*0.45}" fill="none" stroke="#bbb" stroke-width="6"/>
   <circle cx="${cx}" cy="${cy}" r="14" fill="#ccc" ${OL}/>`}

function bike(){return `
 ${wheel(230,1010,105,0)}${wheel(590,1010,105,0.4)}
 <path d="M560 760 L600 1010" stroke="#e0a526" stroke-width="22" stroke-linecap="round"/>
 <path d="M560 760 L600 1010" fill="none" ${OL} stroke-width="3"/>
 <path d="M230 1010 L380 930" stroke="#999" stroke-width="18" stroke-linecap="round"/>
 <rect x="330" y="860" width="150" height="110" rx="20" fill="#333" ${OL}/>
 <path d="M300 950 L180 905 L170 930 L300 985Z" fill="#aaa" ${OL}/>
 <path d="M250 830 L380 820 L560 740 L620 790 L600 870 L480 900 L330 880 L240 870Z" fill="#7b3fd1" ${OL}/>
 <path d="M300 845 L380 835 L420 870 L320 868Z" fill="#1a1a1a"/>
 <path d="M470 800 L560 770 L580 820 L500 850Z" fill="#c9d23a" opacity=".0"/>
 <path d="M450 790 L520 770 M470 815 L560 785" stroke="#e8e8f0" stroke-width="8" stroke-linecap="round"/>
 <path d="M200 815 L330 800 L330 835 L230 850Z" fill="#1a1a1a" ${OL}/>
 <path d="M560 740 L610 690 L650 720 L620 790Z" fill="#b8e4ff" opacity=".85" ${OL}/>
 <ellipse cx="625" cy="800" rx="22" ry="16" fill="#fff8b0" ${OL}/>
 <line x1="545" y1="735" x2="505" y2="720" ${OL} stroke-width="10"/>`}

function rider(t){
  const laugh = ease((t-2.4)/0.25);
  const bob = laugh>0 ? Math.sin(t*28)*6*laugh : 0;
  const look = Math.sin(t*1.3)*3;
  const hy = 520 + bob;
  // hair spikes
  let hair='M345 '+(hy-20);
  const sp=[[350,-95],[375,-55],[395,-110],[420,-60],[445,-115],[465,-58],[495,-90],[490,-20]];
  sp.forEach(([x,y])=>hair+=` L${x} ${hy+y}`);hair+=' Z';
  const eyes = laugh>0.5
    ? `<path d="M380 ${hy+5} q15 -15 30 0 M435 ${hy+5} q15 -15 30 0" fill="none" ${OL}/>`
    : `<circle cx="395" cy="${hy+5}" r="20" fill="#fff" ${OL}/><circle cx="450" cy="${hy+5}" r="20" fill="#fff" ${OL}/>
       <circle cx="${400+look}" cy="${hy+8}" r="7" fill="#1a1a1a"/><circle cx="${455+look}" cy="${hy+8}" r="7" fill="#1a1a1a"/>
       <path d="M375 ${hy-25} L412 ${hy-15} M432 ${hy-15} L470 ${hy-28}" ${OL} stroke-width="7"/>`;
  const mouth = laugh>0.5
    ? `<path d="M395 ${hy+45} Q430 ${hy+40} 465 ${hy+42} Q440 ${hy+95} 400 ${hy+60}Z" fill="#7a1f2b" ${OL}/>
       <path d="M412 ${hy+72} Q430 ${hy+62} 448 ${hy+70}" fill="none" stroke="#ff7a8a" stroke-width="8"/>`
    : `<path d="M400 ${hy+52} Q435 ${hy+62} 462 ${hy+38}" fill="none" ${OL} stroke-width="6"/>`;
  return `
  <path d="M330 850 L350 690 Q360 610 430 610 Q500 610 505 680 L520 790 L440 800 L410 850Z" fill="#222" ${OL}/>
  <path d="M345 850 L470 860 L500 960 L460 965 L440 900 L340 890Z" fill="#2d3e66" ${OL}/>
  <path d="M455 960 L520 960 L520 985 L450 985Z" fill="#fff" ${OL}/>
  <path d="M470 690 L520 735 L545 728" fill="none" stroke="#222" stroke-width="34" stroke-linecap="round"/>
  <circle cx="548" cy="728" r="18" fill="#ffd9b0" ${OL}/>
  <path d="M410 ${hy+70} L405 615 L455 615 L450 ${hy+70}Z" fill="#ffd9b0" ${OL}/>
  <circle cx="425" cy="${hy}" r="78" fill="#ffd9b0" ${OL}/>
  <path d="${hair}" fill="#e2482b" ${OL}/>
  ${[[375,hy+30],[385,hy+40],[470,hy+30],[480,hy+40]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#c46b3a"/>`).join('')}
  ${eyes}${mouth}`}

function friend(t){
  const flash = Math.max(0,1-Math.abs(t-0.9)*6)+Math.max(0,1-Math.abs(t-3.1)*6);
  return `
  <path d="M-20 1290 L-10 1080 Q20 1010 110 1010 Q190 1015 200 1090 L220 1290Z" fill="#4c8a3c" ${OL}/>
  <circle cx="105" cy="960" r="70" fill="#7a4a2a" ${OL}/>
  <path d="M35 945 Q100 860 175 945Z" fill="#3fae4a" ${OL}/>
  <path d="M150 935 L235 945 L230 960 L160 958Z" fill="#2d8a38" ${OL}/>
  <path d="M170 1040 L235 1000" stroke="#4c8a3c" stroke-width="36" stroke-linecap="round"/>
  <g transform="rotate(-12 255 975)">
    <rect x="225" y="925" width="60" height="105" rx="10" fill="#1a1a1a" ${OL}/>
    <rect x="232" y="935" width="46" height="80" rx="4" fill="#9fd8ff"/>
    <circle cx="255" cy="965" r="10" fill="#e2482b"/>
  </g>
  <circle cx="240" cy="1000" r="20" fill="#ffd9b0" ${OL}/>
  ${flash>0?`<circle cx="270" cy="930" r="${40+90*flash}" fill="#fff" opacity="${0.85*flash}"/>
    <path d="M270 860 L278 920 L340 930 L278 940 L270 1000 L262 940 L200 930 L262 920Z" fill="#fff" opacity="${flash}"/>`:''}`}

function render(t){
  const rev = t>1.3&&t<2.3 ? 1 : 0;
  const jx = rev ? Math.sin(t*90)*3 : 0, jy = rev ? Math.cos(t*77)*2 : 0;
  let puffs='';
  if(t>1.3){for(let i=0;i<4;i++){const p=((t-1.3)*1.2+i*0.25)%1;
    puffs+=`<circle cx="${165-p*150}" cy="${915-p*40}" r="${15+p*40}" fill="#ddd" opacity="${(1-p)*0.7*(t<2.8?1:Math.max(0,1-(t-2.8)*2))}" ${OL} stroke-opacity="${(1-p)*.5}"/>`}}
  const vroom = rev ? `<text x="360" y="300" font-family="Impact, Arial Black, sans-serif" font-size="${90+Math.sin(t*30)*6}" fill="#ffd23f" stroke="#1a1a1a" stroke-width="4" paint-order="stroke" text-anchor="middle" transform="rotate(-8 360 300)">ВРУМ!</text>` : '';
  const haha = t>2.6 ? `<text x="590" y="400" font-family="Impact, Arial Black, sans-serif" font-size="60" fill="#fff" stroke="#1a1a1a" stroke-width="5" text-anchor="middle" opacity="${ease((t-2.6)/0.2)}" transform="rotate(10 590 400)">ХА-ХА!</text>` : '';
  document.getElementById('s').innerHTML = `
   <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ab8f0"/><stop offset="1" stop-color="#bfe8ff"/></linearGradient></defs>
   <rect width="720" height="1280" fill="url(#sky)"/>
   ${cloud(60+t*12,60,1.1)}${cloud(430+t*8,110,0.9)}
   ${house()}
   ${puffs}
   <g transform="translate(${jx},${jy})">${bike()}${rider(t)}</g>
   ${friend(t)}${vroom}${haha}`;
}
render(0);
</script></body></html>
